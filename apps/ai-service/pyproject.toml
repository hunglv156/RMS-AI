[project]
name = "rms-ai-service"
version = "0.1.0"
description = "Internal AI service for the RMS recruitment platform"
requires-python = ">=3.13,<3.15"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "numpy>=2.5.5",
    "pymupdf>=2.1",
    "google-genai>=3.6.1",
    "httpx",
    "pyyaml>=6.0.4",
    "python-multipart>=0.0.34",
]

[project.optional-dependencies]
embeddings = [
    "sentence-transformers>=6.3.0",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "ruff",
    "hypothesis>=6.170.17",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: downloads and runs the real embedding model (explicit opt-in)", "live: requires a configured external LLM gateway"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
