[project]
name = "rms-ai-service"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
  "boto3>=1.35",
  "pymupdf>=1.24",
  "pytesseract>=0.3.13",
  "pillow>=10.4",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "hypothesis>=6.115", "ruff>=0.7", "mypy>=1.13", "boto3-stubs[s3]>=1.35"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["ollama: cần Ollama chạy local và dữ liệu Kaggle (chạy bằng -m ollama)"]
addopts = "-m 'not ollama'"
